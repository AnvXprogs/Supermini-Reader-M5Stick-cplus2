; PlatformIO Project Configuration File
;
; Target hardware: M5StickC Plus2
;   SoC   : ESP32-PICO-V3-02 (pkg_ver 6), 8 MB flash, 2 MB PSRAM unused
;   Panel : ST7789 135x240, backlight on GPIO27, power-hold on GPIO4
;   Btns  : BtnA (front), BtnB (top), BtnPWR (side, GPIO35)
;
; https://docs.platformio.org/page/projectconf.html

[env:m5stick-c-plus2]
platform = espressif32
; espressif32 has no m5stick-c-plus2 board definition, so the closest
; ESP32-PICO board is used and every Plus2-specific value is overridden below.
board = m5stick-c
framework = arduino

; --- flash: the Plus2 has 8 MB, the m5stick-c board definition claims 4 MB ---
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

build_flags =
    ; m5stick-c injects -DARDUINO_M5Stick_C, which makes M5GFX seed its
    ; autodetect with board_M5StickC. The Plus2 probe then never runs, because
    ; it is guarded by (board == 0 || board == board_M5StickCPlus2).
    ; M5GFX_BOARD takes priority over the ARDUINO_* chain and pins the board,
    ; which also gets the GPIO4 power-hold asserted on battery power.
    ; 5 == m5gfx::boards::board_M5StickCPlus2
    -DM5GFX_BOARD=5
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; M5StickCPlus2.h is only a thin wrapper over M5Unified and drags in
; M5Family/IRremote/DFRobot_GP8XXX, so depend on M5Unified directly.
lib_deps =
    m5stack/M5Unified@^0.2.21
    m5stack/M5GFX@^0.2.28
